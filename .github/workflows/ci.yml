name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auth_api_test
          POSTGRES_USER: auth_api
          POSTGRES_PASSWORD: auth_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_api -d auth_api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://auth_api:auth_api@localhost:5432/auth_api_test
      JWT_ACCESS_SECRET: ci-access-secret-with-more-than-thirty-two-bytes
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-with-more-than-thirty-two-bytes
      PASSWORD_HASH_MEMORY_COST: 8192
      PASSWORD_HASH_TIME_COST: 1
      PASSWORD_HASH_PARALLELISM: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migration:run
      - run: npm run migration:revert
      - run: npm run migration:run
      - run: npm run test:integration
      - run: npm run test:ci
