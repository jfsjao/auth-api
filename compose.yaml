services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      API_VERSION: ${API_VERSION:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      DATABASE_URL: ${DATABASE_URL:-postgresql://auth_api:auth_api@postgres:5432/auth_api}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-random-access-secret-minimum-32-bytes}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-auth_api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auth_api-clients}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-replace-with-different-random-pepper-minimum-32-bytes}
      PASSWORD_HASH_MEMORY_COST: ${PASSWORD_HASH_MEMORY_COST:-65536}
      PASSWORD_HASH_TIME_COST: ${PASSWORD_HASH_TIME_COST:-3}
      PASSWORD_HASH_PARALLELISM: ${PASSWORD_HASH_PARALLELISM:-1}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: runtime
    command: ['npm', 'run', 'migration:run:prod']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://auth_api:auth_api@postgres:5432/auth_api}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_api}
      POSTGRES_USER: ${POSTGRES_USER:-auth_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_api}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
